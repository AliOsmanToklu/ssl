name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check --output-format=github .
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-fail-under=90
      - name: Smoke test the installed command
        run: kalkan --version

  test-postgres:
    name: Test against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kalkan
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kalkan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kalkan -d kalkan_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      KALKAN_TEST_DATABASE_URL: postgresql+psycopg://kalkan:test@127.0.0.1:5432/kalkan_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_migrations.py tests/test_web.py tests/test_web_phase2.py tests/test_accounts.py tests/test_api.py tests/test_worker.py tests/test_scheduler.py tests/test_cli.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, test-postgres]
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t kalkan:ci .
      - name: Start the image and hit the health check
        run: |
          docker run -d --name kalkan -p 8000:8000 -e KALKAN_SECRET_KEY=ci \
            -e KALKAN_DATABASE_URL=sqlite:////tmp/kalkan.db kalkan:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs kalkan
          exit 1
